[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "numpy>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "bitmax"
version = "0.1.0"
description = "Exact compressed MaxSim scoring for late-interaction retrieval, with CUDA kernels."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Arya Manjaramkar", email = "arya@e3group.ai"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
keywords = ["retrieval", "late-interaction", "colbert", "colpali", "quantization", "maxsim", "cuda"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Aryagm/bitmax"

[project.scripts]
bitmax-bench = "benchmarks.run_synthetic:main"
bitmax-retrieval-bench = "benchmarks.run_retrieval:main"
bitmax-multidataset-bench = "benchmarks.run_multidataset:main"
bitmax-vidore-embeddings = "benchmarks.build_vidore_embeddings:main"
bitmax-mixed-embeddings = "benchmarks.build_mixed_embeddings:main"
bitmax-docscale-stress = "benchmarks.build_docscale_stress:main"
bitmax-reproduce-bench = "benchmarks.reproduce:main"
bitmax-plot-benchmarks = "benchmarks.plot_benchmark_figures:main"
bitmax-vast = "ops.vast.vast_workflow:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pooling = ["scipy>=1.11"]
torch = ["torch>=2.0"]
vast = ["vastai>=0.3.0"]
viz = ["matplotlib>=3.8", "pandas>=2.0", "seaborn>=0.13"]
vision-retrieval = ["accelerate>=0.30", "datasets>=2.19", "pillow>=10", "torch>=2.0", "transformers>=4.57"]
oss-bench = [
  "faiss-gpu==1.14.3; platform_system == 'Linux'",
  "qdrant-client>=1.15",
  "cuvs-cu12>=26.6.0; platform_system == 'Linux'",
  "fast-plaid>=1.4.7.2110; platform_system == 'Linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "benchmark_smoke: short benchmark smoke tests for staged timing signal",
  "cuda: tests that require a CUDA-capable build and GPU",
]

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["src/bitmax", "benchmarks", "ops", "examples"]
